{% extends 'myapp/base.html' %} {% block body %}

<div
  class="min-h-[80vh] flex items-center justify-center bg-slate-50 px-4 py-10"
>
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">Welcome back</h1>

      <p class="mt-2 text-sm text-slate-500">
        Login to your account to continue.
      </p>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-7">
      <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Username
          </label>

          <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
            class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-200"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">
            Password
          </label>

          <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
            class="w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-200"
          />
        </div>

        {% if error %}
        <p class="text-sm text-red-600">{{ error }}</p>
        {% endif %}

        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-lg transition"
        >
          Login
        </button>
      </form>

      <div class="text-center mt-6 pt-5 border-t border-slate-100">
        <p class="text-sm text-slate-500">
          Don't have an account?
          <a
            href="{% url 'register' %}"
            class="font-medium text-slate-900 hover:underline"
          >
            Create account
          </a>
        </p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
