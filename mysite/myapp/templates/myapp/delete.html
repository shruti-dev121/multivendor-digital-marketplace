{% extends 'myapp/base.html' %}

<!---->

{% block body %}

<div
  class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12"
>
  <div class="w-full max-w-md">
    <!-- Delete Card -->
    <div
      class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 text-center"
    >
      <!-- Icon -->
      <div
        class="mx-auto flex items-center justify-center w-14 h-14 rounded-full bg-red-50 mb-6"
      >
        <svg
          class="w-7 h-7 text-red-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3m-9 0h14"
          />
        </svg>
      </div>

      <!-- Heading -->
      <h1 class="text-2xl font-bold text-gray-900">Delete Product?</h1>

      <!-- Message -->
      <p class="mt-3 text-gray-500 leading-relaxed">
        Are you sure you want to delete this product? This action cannot be
        undone.
      </p>

      <!-- Product Name -->
      <div class="mt-6 px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg">
        <p class="text-sm text-gray-500">Product</p>

        <p class="mt-1 font-semibold text-gray-900 truncate">
          {{ product.name }}
        </p>
      </div>

      <!-- Actions -->
      <form action="{% url 'delete' product.id %}" method="post" class="mt-7">
        {% csrf_token %}

        <div class="flex flex-col sm:flex-row gap-3">
          <!-- Cancel -->
          <a
            href="{% url 'index' %}"
            class="flex-1 px-5 py-3 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition"
          >
            Cancel
          </a>

          <!-- Delete -->
          <button
            type="submit"
            class="flex-1 px-5 py-3 rounded-lg bg-red-600 text-white font-medium hover:bg-red-700 transition"
          >
            Delete Product
          </button>
        </div>
      </form>
    </div>

    <!-- Safety Message -->
    <p class="text-center text-xs text-gray-400 mt-5">
      Deleted products cannot be recovered.
    </p>
  </div>
</div>

{% endblock %} ```
